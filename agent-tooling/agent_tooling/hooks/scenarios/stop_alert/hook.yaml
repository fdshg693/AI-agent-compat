# Hook definition read by build/build.py and aggregated into generated/catalog.json.
# Keys are documented in ../../AGENTS.md ("hook.yaml"). Do not write command strings
# here: the installer builds them from the install location.
# Claude: adapters/claude/stop_alert.py (sound/popup backends in agent_tooling/notify/).
# Kilo: adapters/kilo/stop_alert.ts (session.idle) spawns adapters/kilo/stop_alert.py, which uses the same backends.
id: stop_alert
description: 応答完了（Stop）時にアラート音と視覚通知を出す（Windows は画面右下のポップアップ、macOS は通知センター）
distributable: true
agents:
  claude:
    registrations:
      - event: Stop
        timeout: 15
  kilo: {}
